services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resohub-frontend
    ports:
      - 8000:5173 # vite
      - 9060:61000 # Ladle
    volumes:
      - ./frontend/:/app
      - /app/node_modules
      - ./README.md:/app/readme/README.md
      - ./frontend/README.md:/app/readme/frontend-README.md
      - ./backend/README.md:/app/readme/backend-README.md
    environment:
      - NODE_ENV=development
      - VITE_HOST=0.0.0.0
    env_file:
      - .env
    command: npm run dev:all
    stdin_open: true
    tty: true
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: resohub-backend
    ports:
      - 8001:8000
    volumes:
      - ./backend/:/app
      - ./teams_export:/teams_export:ro
      - .:/workspace
    env_file:
      - .env
    stdin_open: true
    tty: true
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: resohub-db
    environment:
      POSTGRES_DB: django-db
      POSTGRES_USER: django
      POSTGRES_PASSWORD: django
      TZ: 'Asia/Tokyo'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U django -d django-db" ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app-network

  garage:
    image: dxflrs/garage:v2.0.0
    container_name: garage
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    restart: unless-stopped
    ports:
      - "3900:3900" # S3 API
      - "3901:3901" # S3 Web
      - "3902:3902" # RPC
      - "3903:3903" # Admin API
    networks:
      - app-network

  garage-webui:
    image: khairul169/garage-webui:latest
    container_name: garage-webui
    restart: unless-stopped
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
    ports:
      - "3909:3909"
    environment:
      API_BASE_URL: "http://garage:3903"
      S3_ENDPOINT_URL: "http://garage:3900"
    depends_on:
      - garage
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "9009:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - garage
    networks:
      - app-network

volumes:
  postgres_data:
  garage_meta:
  garage_data:

networks:
  app-network:
    driver: bridge
