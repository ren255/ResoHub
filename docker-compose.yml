services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resohub-frontend
    ports:
      - 8000:3000 # Vike
      - 9060:61000 # Ladle
    volumes:
      - ./frontend/:/app
      - /app/node_modules
      - ./README.md:/app/readme/README.md
      - ./frontend/README.md:/app/readme/frontend-README.md
      - ./backend/README.md:/app/readme/backend-README.md
    environment:
      - NODE_ENV=development
      - VITE_HOST=0.0.0.0
    env_file:
      - .env
    stdin_open: true
    tty: true
    networks:
      - app-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: resohub-backend
    ports:
      - 8001:8000
    volumes:
      - ./backend/:/app
      - .:/workspace
    env_file:
      - .env
    stdin_open: true
    tty: true
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: resohub-db
    environment:
      POSTGRES_DB: django-db
      POSTGRES_USER: django
      POSTGRES_PASSWORD: django
      TZ: 'Asia/Tokyo'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U django -d django-db" ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app-network

  garage:
    image: dxflrs/garage:v1.0.1
    container_name: resohub-garage
    ports:
      - "3900:3900" # S3 API
      - "3901:3901" # Admin API
      - "3902:3902" # RPC
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage/data
      - garage-meta:/var/lib/garage/meta
    networks:
      - app-network
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "9009:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - garage
    networks:
      - app-network

volumes:
  garage-data:
  garage-meta:


networks:
  app-network:
    driver: bridge
