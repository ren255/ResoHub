services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resohub-frontend
    ports:
      - 8000:3000
    volumes:
      - ./frontend/:/app
      - /app/node_modules
      - ./README.md:/app/readme/README.md
      - ./frontend/README.md:/app/readme/frontend-README.md
      - ./backend/README.md:/app/readme/backend-README.md
    environment:
      - NODE_ENV=development
      - VITE_HOST=0.0.0.0
    env_file:
      - .env
    stdin_open: true
    tty: true
    networks:
      - app-network
    restart: unless-stopped
  
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resohub-backend
    ports:
      - 8001:8000
    volumes:
      - ./backend/:/app
    env_file:
      - .env
    stdin_open: true
    tty: true
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:9.4.0
    container_name: resohub-db
    environment:                  
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: django-db
      MYSQL_USER: django
      MYSQL_PASSWORD: django
      TZ: 'Asia/Tokyo'
    command: mysqld --character-set-server=utf8 --collation-server=utf8_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "django", "-pdjango"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app-network

networks:
  app-network:
    driver: bridge